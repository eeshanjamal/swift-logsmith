name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15's default Xcode (16.4) carries Swift 6.0.x, exercising Package@swift-6.0.swift.
        # macos-26's default Xcode (26.5) carries Swift 6.3, exercising the default Package.swift.
        runner: [macos-15, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      # Coverage is identical across toolchains, so it's only reported from one leg
      # to avoid double-posting the same result to Coveralls.
      - name: Export coverage
        if: matrix.runner == 'macos-26'
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_PATH="$(find "${BIN_PATH}" -name '*.xctest' | head -1)"
          # Paths are rewritten relative to the repo root so Coveralls can map them to source files.
          xcrun llvm-cov export -format=lcov \
            "${XCTEST_PATH}/Contents/MacOS/$(basename "${XCTEST_PATH}" .xctest)" \
            -instr-profile "${BIN_PATH}/codecov/default.profdata" \
            -ignore-filename-regex=".build|Tests" \
            | sed "s|SF:${PWD}/|SF:|" > coverage.lcov

      - name: Upload coverage to Coveralls
        if: matrix.runner == 'macos-26'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          format: lcov
